name: Auto Update Index HTML

on:
  push:
    branches: [ main ] # Hoặc master nếu nhánh chính của bạn là master
    paths:
      - 'Kodi/Plugin Phim/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run generate script
        # Vì file generate_index.py của bạn đang nằm trong Kodi/Plugin Phim
        # nên phải trỏ đúng đường dẫn tới file đó
        run: python "Kodi/Plugin Phim/generate_index.py"
        
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Kodi/Plugin Phim/index.html"
          git diff --cached --quiet || git commit -m "Auto-update index.html cho Plugin Phim"
          git push
