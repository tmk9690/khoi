name: Auto Update All Index HTML

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.zip'
      - '**/*.ZIP'
      - '**/*.apk'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

# Ngăn chặn việc GitHub tự động hủy các tiến trình đang chạy dở
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run generate script
        run: python generate_all_indexes.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          # Chỉ commit nếu có sự thay đổi (tránh lỗi workflow fail khi không có file mới)
          git diff --cached --quiet || git commit -m "Auto-update tat ca index.html"
          git push
